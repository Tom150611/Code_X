<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeX — Đăng ký</title>
  <meta name="description" content="Tạo tài khoản thành viên CLB CodeX." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="auth">
  <div class="aurora" aria-hidden="true">
    <div class="aurora-base"></div>
    <div class="aurora-ribbon r1"></div>
    <div class="aurora-ribbon r2"></div>
    <div class="aurora-ribbon r3"></div>
    <div class="aurora-orb o1"></div>
    <div class="aurora-orb o2"></div>
    <div class="aurora-orb o3"></div>
    <div class="aurora-grid"></div>
    <div class="aurora-grain"></div>
  </div>

  <header class="site-header">
    <a class="brand shine-text" href="index.html">CodeX</a>
    <button class="nav-toggle" type="button" aria-label="Mở menu" aria-expanded="false">Menu</button>
    <nav class="nav">
      <a href="index.html">Trang chủ</a>
      <a href="ve-clb.html">Về CLB</a>
      <a href="founder.html">Founder</a>
      <a href="hoc-tap.html">Học tập</a>
      <a href="cuoc-thi.html">Cuộc thi</a>
      <a href="dang-nhap.html" data-auth-link>Đăng nhập</a>
      <a class="nav-cta" href="tham-gia.html">Tham gia</a>
    </nav>
  </header>

  <section class="hero-stage">
    <img class="hero-bg" src="assets/photos/night-code.png" alt="" />
    <div class="hero-veil"></div>
    <div class="float-shots" aria-hidden="true">
      <img src="assets/photos/keyboard.png" alt="" />
      <img src="assets/photos/python-screen.png" alt="" />
      <img src="assets/photos/books.png" alt="" />
      <img src="assets/photos/terminal.png" alt="" />
    </div>
    <div class="liquid-orb o-a" aria-hidden="true"></div>
    <div class="liquid-orb o-b" aria-hidden="true"></div>
    <div class="liquid-orb o-c" aria-hidden="true"></div>

    <section class="auth-card liquid-card">
      <p class="kicker">Thành viên mới</p>
      <h1 class="shine-text">Đăng ký</h1>
      <p class="lead">Tạo tài khoản để đồng hành cùng CodeX học web, Python và xây sản phẩm.</p>

      <form class="auth-form" id="register-form" novalidate>
        <label>
          Họ và tên
          <input type="text" name="name" autocomplete="name" placeholder="Nguyễn Văn A" required />
        </label>
        <label>
          Khối
          <select name="grade" required>
            <option value="" disabled selected>Chọn khối</option>
            <option value="10">Khối 10</option>
            <option value="11">Khối 11</option>
          </select>
        </label>
        <label class="full">
          Email
          <input type="email" name="email" autocomplete="email" placeholder="ban@email.com" required />
        </label>
        <label>
          Mật khẩu
          <input type="password" name="password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự" minlength="6" required />
        </label>
        <label>
          Nhập lại mật khẩu
          <input type="password" name="confirm" autocomplete="new-password" placeholder="••••••••" minlength="6" required />
        </label>
        <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
        <button class="btn full" type="submit">Tạo tài khoản</button>
      </form>

      <p class="auth-switch">
        Đã có tài khoản?
        <a href="dang-nhap.html">Đăng nhập</a>
      </p>
      <p class="qr-hint">Sau khi đăng ký · Quét QR tại trang Tham gia để nộp đơn CLB</p>
    </section>
  </section>

  <footer class="site-footer">
    <p>CodeX · CLB Lập trình — Công nghệ — AI</p>
  </footer>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
